<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meme Button</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Meme Button</h1>
    <div id="meme-card">
      <img id="meme-image" alt="A random meme" src="" hidden>
      <p id="meme-title">Click the button to load a meme.</p>
      <p id="meme-credit"></p>
    </div>
    <button id="meme-button">Show me a meme</button>
    <p id="error-message" role="alert" hidden></p>
  </main>
  <div id="batch-counter" aria-hidden="true"></div>
  <script type="module" src="script.js"></script>
</body>
</html>
